  "@icons-pack/react-simple-icons": "^13.13.0"
  "@types/node": "^24.9.1"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@vercel/analytics": "^1.3.2"
  better-auth: "^1.4.18"
  date-fns: "^4.1.0"
  drizzle-orm: "^0.44.7"
  eslint: "^9.39.1"
  lucide-react: "^0.548.0"
  next: "16.4.1"
  next-themes: "^0.4.6"
  postgres: "^3.4.7"
  react: "^19.3.1"
  react-day-picker: "9.11.1"
  react-dom: "^19.3.1"
  recharts: "^2.15.4"
  sonner: "^2.0.7"
  typescript: "^5.9.3"
  vitest: "^3.2.4"
  zod: "^4.1.12"
