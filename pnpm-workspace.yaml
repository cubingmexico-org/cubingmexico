packages:
  - "apps/*"
  - "packages/*"

# Don't resolve versions published less than a day ago (minutes); limits exposure to compromised releases.
minimumReleaseAge: 1440

# Versions shared by two or more workspace packages. Reference them with "catalog:".
catalog:
