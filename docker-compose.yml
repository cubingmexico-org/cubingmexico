services:
  db:
    image: postgres:16-alpine
    container_name: cubing_mexico_db
    restart: always
    environment:
      POSTGRES_DB: cubing_mexico
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cubing_mexico"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    container_name: cubing_mexico_migrator
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/cubing_mexico
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: cubing_mexico_backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=postgresql://postgres:postgres@db:5432/cubing_mexico
      - CRON_SECRET=local-dev-cron-secret-12345
      - FLASK_ENV=development
      # Avoid Nominatim 429s during bulk WCA import (state_id left null)
      - SKIP_GEOCODING=true
      # Auto RESULTADOS posts stay off in local compose unless you set Meta secrets
      - SOCIAL_POSTS_ENABLED=false
      - PUBLIC_BASE_URL=http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./apps/backend/app.py:/app/app.py
      - ./apps/backend/common.py:/app/common.py
      - ./apps/backend/utils.py:/app/utils.py
      - ./apps/backend/routes:/app/routes
      - ./apps/backend/social:/app/social
      - ./apps/backend/assets:/app/assets

volumes:
  postgres_data:
