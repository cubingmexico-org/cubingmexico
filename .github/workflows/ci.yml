name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

# Vercel Remote Cache; turbo falls back to the local .turbo cache when these are unset.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # On pull requests, only run tasks for packages changed since the base branch.
  TURBO_FILTER: ${{ github.event_name == 'pull_request' && '--affected' || '' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --affected diffs against the base branch.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Format
        run: pnpm format:check

      - name: Unused files and dependencies
        run: pnpm knip

      - name: Lint, typecheck and test
        run: pnpm turbo run lint check-types test $TURBO_FILTER

      # drizzle-kit generate never connects; the URL only satisfies drizzle.config.ts.
      - name: Migration drift
        env:
          DATABASE_URL: postgresql://unused@localhost/unused
        run: |
          pnpm --filter @workspace/db generate
          git diff --exit-code -- packages/db/drizzle
          test -z "$(git status --porcelain -- packages/db/drizzle)"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cubing_mexico_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cubing_mexico_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cubing_mexico_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Integration tests
        run: pnpm test:integration

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cubing_mexico
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cubing_mexico"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cubing_mexico
      BETTER_AUTH_SECRET: ci-placeholder-secret-ci-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
      WCA_CLIENT_ID: ci-placeholder
      WCA_CLIENT_SECRET: ci-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Migrate and seed database
        run: |
          pnpm --filter @workspace/db migrate
          pnpm --filter @workspace/db seed

      # Events normally come from the WCA import; with Cache Components,
      # generateStaticParams for /rankings fails the build if it returns nothing.
      - name: Insert placeholder event
        run: psql "$DATABASE_URL" -c "INSERT INTO events (id, format, name, rank) VALUES ('333', 'time', '3x3x3 Cube', 10) ON CONFLICT DO NOTHING;"

      - name: Build
        run: pnpm turbo run build $TURBO_FILTER

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: apps/backend

      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
