[project]
name = "cubingmexico-backend"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1.3",
  "geopy>=2.5.0",
  "google-cloud-secret-manager>=2.30.0",
  "gunicorn>=26.0.0",
  "numpy>=2.5.2",
  "pandas>=3.0.5",
  "pillow>=12.3.0",
  "psycopg2-binary>=2.9.12",
  "requests>=2.34.2",
  "werkzeug>=3.1.8",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# Line length is enforced by `ruff format`; long SQL literals are left intact.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "common", "utils", "nemesis_stats", "routes", "social"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
